version: 2
updates:
  # One pull request per ecosystem and week, for all the updates
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
